<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Hidden World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div class="vignette"></div>
  <div id="bubbles"></div>
  <div id="prompt"></div>
  <button id="sound" type="button" aria-pressed="true">SOUND ON</button>
  <div id="hint">WASD / Arrows to move &middot; Shift to run &middot; Space to talk / jump &middot; Enter to chat &middot; M for sound</div>
  <form id="chat" autocomplete="off">
    <label for="chat-input">SAY</label>
    <input id="chat-input" maxlength="80" placeholder="Press Enter to chat" enterkeyhint="send" />
  </form>

  <script src="js/pixel.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sea.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
