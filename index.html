<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Hidden World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="title">
  <canvas id="game"></canvas>
  <div class="vignette"></div>
  <div id="bubbles"></div>
  <div id="prompt"></div>
  <ul id="inventory" aria-label="Inventory" aria-live="polite"></ul>
  <div id="toggles">
    <button id="hints" class="toggle" type="button" aria-pressed="false">HINTS OFF</button>
    <button id="sound" class="toggle" type="button" aria-pressed="true">SOUND ON</button>
    <button id="map" class="toggle" type="button" aria-haspopup="dialog" aria-expanded="false" title="World map (M)" hidden>MAP</button>
  </div>
  <div id="hint">WASD / Arrows to move &middot; Shift to run &middot; Space to talk / jump &middot; 1-6 to pick a slot &middot; F to use it &middot; X to drop it &middot; Enter to chat &middot; M for map &middot; H for hints &middot; N for sound</div>
  <form id="chat" autocomplete="off">
    <label for="chat-input">SAY</label>
    <input id="chat-input" maxlength="80" placeholder="Press Enter to chat" enterkeyhint="send" />
  </form>
  <div id="naming" class="overlay" role="dialog" aria-modal="true" aria-labelledby="naming-title" hidden>
    <form id="naming-form" class="panel" autocomplete="off">
      <h2 id="naming-title">YOUR DRAGON HATCHED!</h2>
      <canvas class="dragon-preview" aria-hidden="true"></canvas>
      <label class="name-label" for="dragon-name">NAME YOUR DRAGON</label>
      <input id="dragon-name" class="name-input" maxlength="12" spellcheck="false" />
      <button type="submit">OK</button>
    </form>
  </div>
  <div id="worldmap" class="overlay" role="dialog" aria-modal="true" aria-labelledby="worldmap-title" hidden>
    <div class="panel map-panel">
      <h2 id="worldmap-title">MAP OF THE HIDDEN WORLD</h2>
      <canvas id="worldmap-canvas" role="img" aria-label="World map"></canvas>
      <button id="worldmap-close" type="button">CLOSE</button>
    </div>
  </div>
  <div id="start" class="overlay" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <form id="start-form" class="panel" autocomplete="off">
      <h1 id="start-title"><small>WELCOME TO</small> HIDDEN WORLD</h1>
      <fieldset class="heroes">
        <legend>CHOOSE YOUR HERO</legend>
        <label class="hero">
          <input type="radio" name="hero" value="male" checked />
          <canvas width="16" height="24" aria-hidden="true"></canvas>
          <span>MALE</span>
        </label>
        <label class="hero">
          <input type="radio" name="hero" value="female" />
          <canvas width="16" height="24" aria-hidden="true"></canvas>
          <span>FEMALE</span>
        </label>
      </fieldset>
      <label class="name-label" for="hero-name">YOUR NAME</label>
      <input id="hero-name" class="name-input" maxlength="12" placeholder="Hickory" spellcheck="false" />
      <button type="submit">START</button>
    </form>
  </div>

  <script src="js/pixel.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/craft.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sea.js"></script>
  <script src="js/map.js"></script>
  <script src="js/title.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
